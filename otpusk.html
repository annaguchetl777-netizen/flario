/* ==== ПАЛИТРА И ТОКЕНЫ ==== */
:root{
  --bg:#FFF3E6;          /* тёплый персиковый крем */
  --card:#FFFFFF;
  --ink:#3B2233;         /* глубокий баклажан — «тень заката» */
  --ink-2:#8A6472;       /* приглушённый текст */
  --ink-3:#B79aa4;
  --coral:#F76C5E;
  --rose:#EE6C8A;
  --amber:#FF9E4F;
  --gold:#FFC24B;
  --ochre:#D9642E;
  --line:rgba(59,34,51,.10);
  --line-2:rgba(59,34,51,.16);
  --sky1:#FFD166; --sky2:#FF9E5C; --sky3:#F0668A;  /* закатный градиент */
  --sea:#2F9DBE;         /* море */
  --sea-deep:#2277A0;
  --mtn:#4F7AAE;         /* горы в сумерках */
  --mtn-deep:#37568A;
  --shadow:0 12px 30px -14px rgba(120,50,40,.45);
  --shadow-sm:0 6px 16px -10px rgba(120,50,40,.5);
  --r:20px;
  --disp:'Cormorant',Georgia,'Times New Roman',serif;
  --hand:'Caveat','Segoe Script',cursive;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Roboto Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--ink);
  background:radial-gradient(120% 80% at 50% -10%, #FFE9C9 0%, var(--bg) 46%, #FBE6DE 100%) fixed;
  min-height:100vh;line-height:1.5;
  text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;
}
.app{max-width:468px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden;
  background:var(--bg);box-shadow:0 0 60px -20px rgba(120,50,40,.35);}
.display{font-family:var(--disp);font-weight:600;letter-spacing:.2px}
.hand{font-family:var(--hand);font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img,svg{display:block}
.screen{animation:screenIn .42s cubic-bezier(.2,.7,.2,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ==== HERO (главная) ==== */
.hero{position:relative;padding:0 0 26px;overflow:hidden;color:#fff;
  background:linear-gradient(178deg,var(--sky1) 0%,var(--amber) 42%,var(--sky3) 100%);}
.hero__sun{position:absolute;top:38px;right:30px;width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle at 42% 40%,#FFF6D8,#FFDE85 60%,#FFC24B);
  box-shadow:0 0 46px 8px rgba(255,214,120,.7);}
.hero__art{position:absolute;left:0;right:0;bottom:-1px;width:100%;display:block}
.hero__inner{position:relative;padding:64px 24px 0;z-index:2}
.hero .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:2.5px;text-transform:uppercase;
  opacity:.9;margin:0 0 6px}
.hero h1{font-family:var(--disp);font-weight:600;font-size:74px;line-height:.92;margin:0;
  color:#fff;text-shadow:0 3px 0 rgba(180,70,50,.18);letter-spacing:0}
.hero__names{font-family:var(--hand);font-size:33px;margin:6px 0 0;color:#fff;
  transform:rotate(-3deg);display:inline-block;text-shadow:0 2px 6px rgba(150,40,40,.28)}
.names-heart{display:inline-block;width:22px;height:22px;margin-left:7px;vertical-align:-3px;
  transform:rotate(-8deg);filter:drop-shadow(0 2px 3px rgba(150,40,40,.25))}
.names-heart svg{width:22px;height:22px}
.hero__dates{font-family:var(--mono);font-size:13px;letter-spacing:1px;margin:16px 0 0;opacity:.95}

/* полоска-конспект под героем */
.overview{padding:22px 22px 6px}
.lede{font-family:var(--disp);font-weight:500;font-size:22px;line-height:1.32;color:var(--ink);
  margin:0 0 18px}
.stats{display:flex;gap:10px;margin:0 0 4px}
.stat{flex:1;background:var(--card);border-radius:16px;padding:12px 12px;box-shadow:var(--shadow-sm);
  text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-family:var(--disp);font-weight:600;font-size:26px;line-height:1;color:var(--ochre)}
.stat span{display:block;font-size:11px;letter-spacing:.4px;color:var(--ink-2);margin-top:5px}

/* ==== СПИСОК ДНЕЙ ==== */
.days{padding:14px 18px 40px}
.phase{display:flex;align-items:center;gap:12px;margin:24px 4px 12px}
.phase:first-child{margin-top:8px}
.phase__label{font-family:var(--hand);font-size:23px;color:var(--ph,var(--ochre));white-space:nowrap;line-height:1}
.phase__line{flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}
.phase__ic{display:inline-flex;flex:none;color:var(--ph,var(--amber))}
.phase svg{width:18px;height:18px;flex:none}

.daycard{display:flex;align-items:stretch;gap:0;background:var(--card);border-radius:18px;
  margin:0 0 12px;box-shadow:var(--shadow-sm);border:1px solid var(--line);
  overflow:hidden;position:relative;width:100%;text-align:left;
  transition:transform .16s ease, box-shadow .16s ease}
.daycard:active{transform:scale(.985)}
.daycard__stub{width:66px;flex:none;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(160deg,var(--c1),var(--c2))}
.daycard__stub::after{content:"";position:absolute;top:0;bottom:0;right:-1px;width:2px;
  background-image:radial-gradient(circle,var(--bg) 1.5px,transparent 1.6px);
  background-size:2px 9px;background-repeat:repeat-y}
.daycard__num{font-family:var(--disp);font-weight:600;font-size:34px;line-height:.9}
.daycard__day{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;opacity:.9;margin-top:2px}
.daycard__body{flex:1;padding:13px 14px 13px 15px;min-width:0}
.daycard__date{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.6px;color:var(--ink-2)}
.daycard__title{display:block;font-family:var(--disp);font-weight:700;font-size:25px;line-height:1.04;margin:4px 0 5px;color:var(--ink)}
.daycard__teaser{font-size:12.5px;color:var(--ink-2);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.daycard__chev{flex:none;align-self:center;padding:0 12px 0 4px;color:var(--ink-3)}
.tagchip{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.8px;
  text-transform:uppercase;padding:2px 7px;border-radius:20px;margin-top:7px;
  background:var(--chip-bg);color:var(--chip-fg)}

.footer{text-align:center;padding:8px 20px 40px;color:var(--ink-3);font-size:11px;font-family:var(--mono);letter-spacing:.5px}
.footer svg{width:15px;height:15px;display:inline-block;vertical-align:-3px;margin:0 2px;color:var(--amber)}
.footer .fheart{color:var(--rose)}
.footer .fheart svg{width:13px;height:13px}

/* ==== ВЕРХНЯЯ ПАНЕЛЬ (день) ==== */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:12px 12px;padding-top:max(12px,env(safe-area-inset-top));
  background:linear-gradient(180deg, rgba(255,243,230,.98), rgba(255,243,230,.86));
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb-back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;
  padding:8px 12px 8px 8px;border-radius:14px;background:var(--card);box-shadow:var(--shadow-sm);
  border:1px solid var(--line)}
.tb-back svg{width:18px;height:18px}
.tb-title{flex:1;text-align:center;min-width:0}
.tb-title b{display:block;font-family:var(--disp);font-weight:600;font-size:18px;line-height:1;color:var(--ink)}
.tb-title span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.8px;color:var(--ink-2);margin-top:2px}
.tb-nav{display:flex;gap:6px}

      lastPhase=d.phase;
      const ph=PHASE[d.phase]||{color:'var(--ochre)',icon:'sun'};
      cards+=`<div class="phase" style="--ph:${ph.color}"><span class="phase__label hand">${esc(d.phase)}</span>
        <span class="phase__line"></span><span class="phase__ic">${ICONS[ph.icon]||ICONS.sun}</span></div>`;
    }
    const chip=REGION_CHIP[d.region]||{bg:'#F1E7DE',fg:'#7A5A66'};
    cards+=`<button class="daycard" onclick="go(${d.n})"
        style="--c1:${d.accent[0]};--c2:${d.accent[1]}">
      <span class="daycard__stub"><span class="daycard__num">${d.n}</span><span class="daycard__day">День</span></span>
      <span class="daycard__body">
        <span class="daycard__date">${esc(d.date).toUpperCase()} · ${esc(d.weekday)}</span>
        <span class="daycard__title">${esc(d.title)}</span>
        <span class="daycard__teaser">${esc(d.teaser)}</span>
        <span class="tagchip" style="--chip-bg:${chip.bg};--chip-fg:${chip.fg}">${esc(d.region)}</span>
      </span>
      <span class="daycard__chev">${ICONS.chev}</span>
    </button>`;
  });

  app.innerHTML=`<div class="screen">
    <header class="hero">
      <div class="hero__sun"></div>
      <div class="hero__inner">
        <p class="eyebrow">Путешествие · Georgia</p>
        <h1>${esc(TRIP.title)}</h1>
        <div class="hero__names">${esc(TRIP.people)}<span class="names-heart">${ICONS.heart}</span></div>
        <p class="hero__dates">${esc(TRIP.dates)} · 10 дней</p>
      </div>
      ${horizonSVG()}
    </header>

    <section class="overview">
      <p class="lede">${esc(TRIP.lede)}</p>
      <div class="stats">
        <div class="stat"><b>10</b><span>дней</span></div>
        <div class="stat"><b>3</b><span>города</span></div>
        <div class="stat"><b>25→3</b><span>авг — сен</span></div>
      </div>
    </section>

    <section class="days">${cards}</section>
    <div class="footer"><span class="fheart">${ICONS.heart}</span> собрано с любовью к поездке <span class="fheart">${ICONS.heart}</span></div>
  </div>`;
}

function connectorHTML(next){
  if(!next) return '';
  const mi=ICONS[MOVE_ICON[next.mode]]||ICONS.walk;
  return `<div class="link-row"><div class="link-rail"><div class="link-icon">${mi}</div></div>
    <div class="link-text"><b>${esc(next.dur||'')}</b> ${esc(MOVE_LABEL[next.mode]||'')}</div></div>`;
}

function bufferHTML(s,last){
  return `<div class="tl-row${last?' tl-last':''}">
    <div class="tl-rail"><div class="tl-node is-buffer">${ICONS.clock}</div></div>
    <div class="buffer">
      <div class="buffer__t"><span class="buffer__title">${esc(s.title||'Буфер')}</span>
        ${s.budget?`<span class="buffer__dur">${esc(s.budget)}</span>`:''}</div>
      ${s.desc?`<p>${esc(s.desc)}</p>`:''}
    </div>
  </div>`+connectorHTML(s.next);
}

function stopHTML(s,i,last){
  const nodeCls = s.opt ? 'is-opt' : (s.kind==='meal' ? 'is-meal' : (s.kind==='move' ? 'is-move' : ''));
  const icon = ICONS[s.icon]||ICONS.pin;
  const badges=[];
  if(s.flag) badges.push(`<span class="chip chip--flag">${ICONS[s.flag.icon]||ICONS.info}${esc(s.flag.label)}</span>`);
  if(s.opt) badges.push(`<span class="chip chip--opt">${ICONS.star}${esc(s.optLabel||'по желанию')}</span>`);
  if(s.tbd) badges.push(`<span class="chip chip--tbd">${ICONS.pin}место уточняется</span>`);
  const body=`
    <div class="stop__body"><div class="stop__body-in">
      ${s.desc?`<p class="stop__desc">${esc(s.desc)}</p>`:''}
      ${s.tips?`<div class="tips"><b>${ICONS.compass}на заметку</b><p>${esc(s.tips)}</p></div>`:''}
      ${s.map?`<a class="maplink" href="${esc(s.map)}" target="_blank" rel="noopener">${ICONS.pin}Открыть на карте</a>`:''}
    </div></div>`;
  const row=`
  <div class="tl-row${last?' tl-last':''}">
    <div class="tl-rail"><div class="tl-node ${nodeCls}">${icon}</div></div>
    <div class="stop" style="animation-delay:${i*45}ms">
      <button class="stop__head" onclick="this.closest('.stop').classList.toggle('open')">
        <span class="stop__topline">
          <span class="stop__time mono">${esc(s.time)}</span>
          <span class="stop__topright">
            ${s.budget?`<span class="stop__dur">${ICONS.clock}${esc(s.budget)}</span>`:''}
            <span class="stop__chev">${ICONS.chev}</span>
          </span>
        </span>
        <span class="stop__title">${esc(s.title)}</span>
        ${s.place?`<span class="stop__place">${esc(s.place)}</span>`:''}
        ${badges.length?`<span class="stop__badges">${badges.join('')}</span>`:''}
      </button>
      ${body}
    </div>
  </div>`;
  return row+connectorHTML(s.next);
}

function variantsHTML(v){
  let cards='';
  (v.options||[]).forEach(o=>{
    cards+=`<div class="vcard">
      <div class="vcard__h"><span class="vcard__t">${esc(o.title)}</span>
        ${o.tag?`<span class="vcard__tag">${esc(o.tag)}</span>`:''}</div>
      ${o.place?`<div class="stop__place">${esc(o.place)}</div>`:''}
      ${o.desc?`<p>${esc(o.desc)}</p>`:''}
      ${o.tbd?`<span class="stop__badges"><span class="chip chip--tbd">${ICONS.pin}место уточняется</span></span>`:''}
      ${o.map?`<a class="maplink" href="${esc(o.map)}" target="_blank" rel="noopener">${ICONS.pin}Открыть на карте</a>`:''}
    </div>`;
  });
  return `<section class="variants"><h3 class="variants__h">${ICONS.compass}${esc(v.title)}</h3>
    ${v.note?`<p class="variants__note">${esc(v.note)}</p>`:''}${cards}</section>`;
}

function renderDay(n){
  const days=TRIP.days, idx=days.findIndex(d=>d.n===n), d=days[idx];
  if(!d){ location.hash=''; return; }
  const prev=days[idx-1], next=days[idx+1];

  let inner;
  if(d.stops&&d.stops.length){
    let tl='';
    d.stops.forEach((s,i)=>{
      const last=i===d.stops.length-1;
      tl+= s.type==='buffer' ? bufferHTML(s,last) : stopHTML(s,i,last);
    });
    inner=`<div class="timeline">${tl}</div>${d.variants?variantsHTML(d.variants):''}`;
  } else {
    inner=`<div class="stub">${ICONS.tools}
      <h3>День готовится</h3>
      <p>Обложка и структура уже на месте — программа этого дня появится после того, как ты утвердишь стиль на Дне 1.</p></div>`;
  }

  app.innerHTML=`<div class="screen">
    <div class="topbar">
      <a class="tb-back" href="#/">${ICONS.left}Маршрут</a>
      <div class="tb-title"><b>День ${d.n}</b><span>${esc(d.date).toUpperCase()}</span></div>
      <div class="tb-nav">
        <button class="tb-arrow" ${prev?`onclick="go(${prev.n})"`:'disabled'}>${ICONS.left}</button>
        <button class="tb-arrow" ${next?`onclick="go(${next.n})"`:'disabled'}>${ICONS.right}</button>
      </div>
    </div>

    <header class="dayhead" style="--c1:${d.accent[0]};--c2:${d.accent[1]}">
      <div class="dayhead__sun"></div>
      <p class="kicker">День ${d.n} · ${esc(d.weekday)}</p>
      <h2>${esc(d.title)}</h2>
      ${d.sub?`<p class="sub">${esc(d.sub)}</p>`:''}
      <span class="region">${ICONS.pin}${esc(d.region)}</span>
    </header>

    ${d.note?`<div class="callout"><b>${ICONS.info}Когда принимать решение</b><p>${esc(d.note)}</p></div>`:''}

    ${inner}

    <nav class="daynav">
      <a class="prev" ${prev?`href="#/day/${prev.n}"`:'aria-disabled="true"'}>
        ${ICONS.left}<span><span class="dn-l">Назад</span><span class="dn-t">${prev?esc(prev.title):'—'}</span></span></a>
      <a class="next" ${next?`href="#/day/${next.n}"`:'aria-disabled="true"'}>
        ${ICONS.right}<span><span class="dn-l">Дальше</span><span class="dn-t">${next?esc(next.title):'—'}</span></span></a>
    </nav>
  </div>`;
}


function go(n){ location.hash='#/day/'+n; }
window.addEventListener('hashchange',render);
render();
